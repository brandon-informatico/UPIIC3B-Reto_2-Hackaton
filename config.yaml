# Configuración del proyecto Validat3B (rutas relativas a la raíz del repo)
rutas:
  capturas: data/capturas.json
  catalogo: data/catalogo_productos.csv
  imagenes: data/                     # las rutas imagenes/... de cada captura son relativas a data/
  salida: resultados/resultados.json
  cache: cache/

# E1 carga + E2 visión local (src/datos, responsable Copa). Salidas dentro de rutas.cache
datos:
  salidas:
    indice_fotos: indice_fotos.json                 # IndiceFotos
    capturas_preparadas: capturas_preparadas.json   # list[CapturaPreparada]
    features: features.json                         # {capture_id: FeaturesCaptura}
    reporte: reporte_datos.json
  hilos: 6
  normalizacion:
    # px del lado largo de la copia para la IA. Etiqueta a 768: ~590 tokens (vs 922 a 960) sin perder lectura.
    lado_max: {facade: 512, product: 960, shelf: 768}
    clahe: {facade: 2.0, product: 2.0, shelf: 3.0}  # emparejado de luz (solo en la copia para la IA)
    calidad_jpeg: 85
    leer_codigos: true                              # requiere zxing-cpp
